plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'io.github.somilkhan.instaeclipse2'
    compileSdk 34
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "io.github.somilkhan.instaeclipse2"
        minSdkVersion 28
        targetSdk 36
        versionCode 22
        versionName '0.8.4'

        // Single source of truth for the GitHub "owner/name" of this project.
        // Everything in code derives its links from RepoLinks, which reads this field.
        buildConfigField "String", "GITHUB_REPO", "\"somilkhan/Eclipse-2\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing comes from the environment (see RELEASING.md / .github/workflows/release.yml).
    // Local builds without these variables still produce an unsigned release APK.
    def releaseKeystore = System.getenv("IE_KEYSTORE_PATH")
    def releaseSigningReady = releaseKeystore && System.getenv("IE_KEYSTORE_PASSWORD") \
            && System.getenv("IE_KEY_ALIAS") && System.getenv("IE_KEY_PASSWORD")
    if (System.getenv("IE_REQUIRE_SIGNING") == "true" && !releaseSigningReady) {
        throw new GradleException("Release signing required but IE_KEYSTORE_PATH, IE_KEYSTORE_PASSWORD, " +
                "IE_KEY_ALIAS or IE_KEY_PASSWORD is not set. See RELEASING.md.")
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("IE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("IE_KEY_ALIAS")
                keyPassword System.getenv("IE_KEY_PASSWORD")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Robolectric screenshot tests (ScreenshotTest) need merged resources + assets.
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Pass -Pie.screenshots=true to write PNGs to docs/screenshots/0.8.4/, or
            // -Pie.screenshotSet=final to write them to docs/screenshots/0.8.4/final/.
            if (project.hasProperty('ie.screenshots') || project.hasProperty('ie.screenshotSet')) {
                def set = project.findProperty('ie.screenshotSet')
                systemProperty 'instaeclipse.screenshotDir',
                        rootProject.file('docs/screenshots/0.8.4' + (set ? '/' + set : '')).absolutePath
            }
            systemProperty 'robolectric.pixelCopyRenderMode', 'hardware'
            // Robolectric's RenderEffect doesn't really blur: screenshots use the CPU blur path
            // (the same one API 28-30 devices use). -Pie.hwBlur=true to exercise RenderEffect.
            if (!project.hasProperty('ie.hwBlur')) systemProperty 'instaeclipse.softBlur', 'true'
            maxHeapSize = '1536m'
            ['instaeclipse.ffmpeg', 'instaeclipse.ffprobe', 'instaeclipse.fixtureOutput'].each { key ->
                if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
            }
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // Core Android dependencies
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.gson
    implementation libs.dexkit
    implementation 'com.google.android.material:material:1.12.0'
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "androidx.dynamicanimation:dynamicanimation:1.0.0"
    implementation libs.osmdroid
    // Liquid Glass (MIT, View system): lens refraction tab bar, scroll-edge blur, glass buttons (API 33+).
    implementation 'com.github.QWEA0:liquidglass:v2.0.11'

    // External library for shared preferences
    implementation libs.fileprefs
    // Testing dependencies
    testImplementation libs.junit
    // Test-only: Robolectric native-graphics renders of the companion screens (docs/screenshots).
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testRuntimeOnly files('libs/api-82.jar')
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core.v361

    // Compile-only dependency
    compileOnly files('libs/api-82.jar')
}
