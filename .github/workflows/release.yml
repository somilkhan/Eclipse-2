name: Release

# Push a tag vX.Y.Z (or vX.Y.Z-beta.N / -rc.N / -alpha.N) to build a signed release APK and
# publish a GitHub Release with the matching CHANGELOG.md section as notes. See RELEASING.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Release signing secrets missing::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions (see RELEASING.md). No release was published."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse tag
        id: tag
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z or vX.Y.Z-suffix"; exit 1
          fi
          version="${TAG#v}"
          base="${BASH_REMATCH[1]}"
          prerelease=false
          [ -n "${BASH_REMATCH[3]}" ] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version $version (base $base), pre-release: $prerelease"

      - name: Check versionName matches the tag
        run: |
          name=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -1)
          echo "app/build.gradle versionName: $name"
          if [ "$name" != "${{ steps.tag.outputs.version }}" ] && [ "$name" != "${{ steps.tag.outputs.base }}" ]; then
            echo "::error::versionName '$name' in app/build.gradle does not match tag $TAG. Bump it (and versionCode) first."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          .github/scripts/changelog-section.sh "${{ steps.tag.outputs.version }}" CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          echo "----- release notes -----"; cat "$RUNNER_TEMP/notes.md"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          [ -s "$RUNNER_TEMP/release.jks" ] || { echo "::error::RELEASE_KEYSTORE_BASE64 did not decode to a keystore"; exit 1; }

      # Robolectric's android-all jars: cached between runs and prefetched with retries, so a
      # flaky Maven Central download can't fail every Robolectric test (see the script).
      - name: Cache Robolectric SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-android-all-${{ hashFiles('.github/scripts/prefetch-robolectric.sh') }}

      - name: Prefetch Robolectric SDK jars
        run: bash .github/scripts/prefetch-robolectric.sh

      - name: Run unit tests
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest

      - name: Build signed release APK
        env:
          IE_REQUIRE_SIGNING: 'true'
          IE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          IE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          IE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          IE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Check native libs are 16 KB aligned
        run: bash .github/scripts/check-native-alignment.sh "$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)"

      - name: Verify signature and rename
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1 || true)
          if [ -z "$apk" ]; then
            echo "::error::No signed release APK produced"; ls -R app/build/outputs/apk || true; exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk"
          out="Eclipse2-${TAG}.apk"
          cp "$apk" "$out"
          sha256sum "$out" | tee "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
            --title "Eclipse 2 $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag "${flags[@]}"

      # Mirror the exact signed APK to the LSPosed module repository. The target tag
      # format is versionCode-versionName (for example: 24-0.9.1).
      - name: Publish LSPosed module release
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=LSPosed sync not configured::Add XPOSED_REPO_TOKEN under Settings > Secrets and variables > Actions to enable automatic LSPosed publishing."
            exit 0
          fi

          version_code=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]\+\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)
          if ! [[ "$version_code" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read numeric versionCode from app/build.gradle"
            exit 1
          fi
          xposed_tag="${version_code}-${VERSION}"
          xposed_repo="Xposed-Modules-Repo/io.github.somilkhan.instaeclipse2"

          if gh release view "$xposed_tag" --repo "$xposed_repo" >/dev/null 2>&1; then
            gh release edit "$xposed_tag" --repo "$xposed_repo" \
              --title "Eclipse 2 v$VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$xposed_tag" "$APK" --repo "$xposed_repo" --clobber
          else
            flags=()
            if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$xposed_tag" "$APK" \
              --repo "$xposed_repo" \
              --target main \
              --title "Eclipse 2 v$VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${flags[@]}"
          fi

          echo "Published $APK to $xposed_repo as $xposed_tag"

      # The in-app update checker reads version.json from main. Bump it for stable releases so
      # users are offered the new build; pre-releases leave it alone.
      - name: Point the update checker at this release
        if: steps.tag.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          git fetch --depth=1 origin main
          git checkout -B update-version-json origin/main
          current=$(sed -n 's/.*"latest_version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' version.json)
          if [ "$current" = "$VERSION" ]; then echo "version.json already at $VERSION"; exit 0; fi
          printf '{\n  "latest_version": "%s",\n  "update_url": "https://github.com/%s/releases/latest"\n}\n' \
            "$VERSION" "$GITHUB_REPOSITORY" > version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "version.json: $VERSION"
          git push origin HEAD:main

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
