name: Build Debug APK

on:
  push:
    branches:
      - main
      - 0.4
      - 'maintainer/**'   # integration branches, e.g. maintainer/0.8.4
  pull_request:          # every pull request, whatever its target branch
  workflow_dispatch:  # Allow manual triggering via the GitHub Actions UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_debug_apk:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17 (also caches Gradle dependencies/wrapper)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'  # the old 'tools' package no longer exists

      # Step 4: Grant execution permissions to gradlew
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # Robolectric's android-all jars: cached between runs and prefetched with retries, so a
      # flaky Maven Central download can't fail every Robolectric test (see the script).
      - name: Cache Robolectric SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-android-all-${{ hashFiles('.github/scripts/prefetch-robolectric.sh') }}

      - name: Prefetch Robolectric SDK jars
        run: bash .github/scripts/prefetch-robolectric.sh

      # Step 5: Run unit tests before building
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Step 6: Sign debug builds with the release key, so they update over release installs.
      # Secrets are not passed to pull requests from forks; those keep Gradle's debug key.
      - name: Decode release keystore
        id: keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 not set; the debug APK uses Gradle's debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          [ -s "$RUNNER_TEMP/release.jks" ] || { echo "::error::RELEASE_KEYSTORE_BASE64 did not decode to a keystore"; exit 1; }
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      # Step 7: Build the debug APK
      - name: Build Debug APK
        env:
          IE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          IE_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.path && secrets.RELEASE_KEYSTORE_PASSWORD || '' }}
          IE_KEY_ALIAS: ${{ steps.keystore.outputs.path && secrets.RELEASE_KEY_ALIAS || '' }}
          IE_KEY_PASSWORD: ${{ steps.keystore.outputs.path && secrets.RELEASE_KEY_PASSWORD || '' }}
        run: ./gradlew assembleDebug

      # 16 KB-page devices (Android 15+) can't load native libs with 4 KB-aligned segments.
      - name: Check native libs are 16 KB aligned
        run: bash .github/scripts/check-native-alignment.sh app/build/outputs/apk/debug/*.apk

      - name: Show debug APK signer
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "DN|SHA-256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # Step 8: Upload the debug APK as an artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
